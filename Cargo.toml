[package]
name = "teams-presence-tracker"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <you@example.com>"]
description = "Track Microsoft Teams presence history via Graph API"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
# rusqlite removed — using CSV file storage to avoid C compiler dependency on Windows GNU toolchain
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
csv = "1"
